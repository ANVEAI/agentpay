name: Publish SDK to npm

# Tag a release to publish, e.g.:  git tag v0.1.0 && git push --tags
# Requires repo secret NPM_TOKEN (npmjs.com → Access Tokens → Automation).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @agentpay/merchant-sdk build
      - run: pnpm --filter @agentpay/merchant-sdk publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
