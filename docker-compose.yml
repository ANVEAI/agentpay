services:
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://sepolia.base.org}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required - see .env.example}
      AGENTPAY_PAYTO: ${AGENTPAY_PAYTO:-}
      AGENTPAY_ADMIN_TOKEN: ${AGENTPAY_ADMIN_TOKEN:-}
    restart: unless-stopped
